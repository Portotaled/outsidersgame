<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outsiders Free To Play Game</title>

    <style>
        @font-face {
            font-family: 'GameFont';
            src: url('assets/GAMEFONT.ttf') format('truetype');
        }

        :root {
            --gold: #d4af37;
            --gold-dim: #8c6e1e;
            --bg: #08120f;
            --text: #efe8d6;
            --muted: #dbc78a;
            --border: rgba(212,175,55,0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: GameFont, Inter, system-ui, sans-serif;
            background: #07120f;
            color: var(--text);
        }

        #story-text {
            line-height: 1.8;
            white-space: pre-wrap;
            font-family: GameFont, monospace;
        }

        header {
            text-align: center;
            color: var(--gold);
            padding: 1.5rem;
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
        }

        .panel-inner {
            padding: 2rem;
        }

        #intro-screen {
            display: grid;
            place-items: center;
            text-align: center;
            gap: 1.5rem;
        }

        .button, .choice-btn {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(var(--gold), var(--gold-dim));
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        #game-screen {
            position: relative;
            background: url('assets/TITLE.png') center/cover;
        }

        #game-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
        }

        #game-screen > .panel-inner,
        #story-container,
        #choices,
        .game-header {
            position: relative;
        }
    </style>
</head>

<body>

<header>
    <p>Outsiders Free To Play Game</p>
</header>

<main>
    <section class="panel">

        <div class="panel-inner" id="intro-screen">
            <div>
                <h1>Play The Outsiders Story</h1>
                <p>Browser playable version of the game</p>
            </div>

            <button id="start-button" class="button">Load Game</button>

            <a class="button" href="assets/OutsidersGame.py" download>
                Download Python Game
            </a>
        </div>

        <div class="panel-inner hidden" id="game-screen">

            <div class="game-header">
                <h2 id="game-title">THE OUTSIDERS</h2>
                <div id="level-title">Level 1</div>
            </div>

            <div id="story-container">
                <div id="story-text"></div>
            </div>

            <div id="choices"></div>

            <div id="footer-bar">
                <div id="hint-text">Use buttons to play</div>
                <button id="restart-button" class="button hidden">Back</button>
            </div>

        </div>

    </section>
</main>

<script>
window.OUTSIDERS_GAME_DATA = {
    "1": {
        title: "LEVEL 1",
        start: "intro",
        nodes: {
            intro: {
                type: "text",
                text: "You are Ponyboy...",
                next: "choice_route"
            },
            choice_route: {
                type: "choice",
                options: [
                    ["Back alleys", "alley"],
                    ["Main street", "main"]
                ]
            },
            alley: {
                type: "text",
                text: "You take the alley...",
                next: "rescue"
            },
            main: {
                type: "text",
                text: "You go main street...",
                next: "rescue"
            },
            rescue: {
                type: "text",
                text: "Your gang arrives.",
                next: "__next_level__"
            }
        }
    }
};

const GAME_DATA = window.OUTSIDERS_GAME_DATA;

const stateNames = {
    TITLE: "title",
    NARRATIVE: "narrative",
    CHOICE: "choice"
};

let currentState = stateNames.TITLE;
let navLevel = 1;
let currentNode = null;

const introScreen = document.getElementById("intro-screen");
const gameScreen = document.getElementById("game-screen");
const storyText = document.getElementById("story-text");
const choicesContainer = document.getElementById("choices");
const gameTitle = document.getElementById("game-title");
const levelTitle = document.getElementById("level-title");

function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function formatStory(text) {
    return `<p>${escapeHTML(text)}</p>`;
}

function setState(state) {
    currentState = state;
    render();
}

function loadNode(id) {
    currentNode = GAME_DATA[navLevel].nodes[id];

    if (currentNode.type === "text") setState(stateNames.NARRATIVE);
    if (currentNode.type === "choice") setState(stateNames.CHOICE);
}

function startLevel() {
    loadNode(GAME_DATA[navLevel].start);
}

function advanceNode() {
    if (currentNode.next) loadNode(currentNode.next);
}

function chooseOption(i) {
    loadNode(currentNode.options[i][1]);
}

function startGame() {
    navLevel = 1;
    introScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    startLevel();
}

function render() {
    if (!currentNode) return;

    gameTitle.textContent = GAME_DATA[navLevel].title;
    levelTitle.textContent = "Level " + navLevel;

    storyText.innerHTML = formatStory(currentNode.text || "");

    choicesContainer.innerHTML = "";

    if (currentState === stateNames.NARRATIVE) {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = "Continue";
        btn.onclick = advanceNode;
        choicesContainer.appendChild(btn);
    }

    if (currentState === stateNames.CHOICE) {
        currentNode.options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.textContent = opt[0];
            btn.onclick = () => chooseOption(i);
            choicesContainer.appendChild(btn);
        });
    }
}

window.addEventListener("load", () => {
    document.getElementById("start-button").addEventListener("click", startGame);
    render();
});
</script>

</body>
</html>
